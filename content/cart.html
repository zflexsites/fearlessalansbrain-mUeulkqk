              <span id="cart-subtotal" style="color: var(--text-color);">0.00 EUR</span>
            </div>
            <div class="flex justify-between">
              <span style="color: var(--text-muted-color);">Livraison</span>
              <span style="color: var(--text-color);">À calculer</span>
            </div>
          </div>
          <div class="flex justify-between font-bold text-lg border-t pt-4 mt-4" style="border-color: var(--card-border-color);">
            <span>Total</span>
            <span id="cart-total">0.00 EUR</span>
          </div>
          <a
            href="/checkout/"
            id="checkout-link"
            class="zflex-link block mt-6 w-full bg-primary text-white text-center font-semibold py-3 rounded-lg hover:opacity-90 transition btn-primary"
            data-analytics-type="begin_checkout" data-analytics-payload="{&quot;itemCount&quot;:0}"
          >
            Passer la commande
          </a>
        </div>
      </div>
    </div>
  </section>

  <!-- Le template pour un item -->
  <template id="cart-item-template">
    <div class="cart-item flex items-center justify-between p-4 rounded-lg" style="background-color: var(--card-bg-color); border: 1px solid var(--card-border-color);">
      <div class="flex items-center">
        <img data-template-field="image" src="" alt="" class="w-20 h-20 object-cover rounded-md mr-4">
        <div>
          <a data-template-field="url" href="#">
            <h3 data-template-field="title" class="font-semibold" style="color: var(--text-color);"></h3>
          </a>
          <p data-template-field="price" class="text-sm" style="color: var(--text-muted-color);"></p>
        </div>
      </div>
      <div class="text-right">
        <div class="flex items-center gap-x-2">
            <input data-template-field="quantity" type="number" min="1" value="1" class="w-16 text-center rounded-md border-gray-300">
            <button data-template-field="remove-btn" title="Supprimer l'article" class="p-1 text-gray-400 hover:text-red-500 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
        </div>
        <p data-template-field="total" class="font-semibold mt-2 text-sm" style="color: var(--text-color);"></p>
      </div>
    </div>
  </template>
</main>
