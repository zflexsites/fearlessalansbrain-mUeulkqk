                viewBox="0 0 20 20"
                fill="currentColor"
              >
                <path
                  fill-rule="evenodd"
                  d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM6.293 6.707a1 1 0 010-1.414l3-3a1 1 0 011.414 0l3 3a1 1 0 01-1.414 1.414L11 5.414V13a1 1 0 11-2 0V5.414L7.707 6.707a1 1 0 01-1.414 0z"
                  clip-rule="evenodd"
                />
              </svg>
              <span>Importer une image</span>
            </label>
            <input
              type="file"
              id="qr-file-input"
              class="hidden"
              accept="image/*"
            />
          </div>
        </div>

        <!-- ÉTAPE 2 : LE SCANNER (caché) -->
        <div id="qr-scanner-container" class="hidden">
          <div
            id="qr-reader"
            class="w-full max-w-sm mx-auto border-2 border-dashed rounded-lg"
            style="border-color: var(--card-border-color)"
          ></div>
          <p
            id="qr-scanner-error"
            class="p-4 text-sm text-center text-red-500 hidden"
          ></p>
        </div>

        <!-- ÉTAPE 3 : LE RÉSULTAT (caché) -->
        <div id="qr-result-container" class="text-center hidden">
          <h3 class="text-xl font-bold">Statut de la commande</h3>
          <div
            id="qr-result-status"
            class="mt-2 text-2xl font-bold py-3 px-4 rounded-lg"
          ></div>
          <p
            id="qr-result-message"
            class="mt-2"
            style="color: var(--text-muted-color)"
          ></p>
          <button
            id="scan-again-btn"
            class="mt-4 text-sm underline text-primary"
          >
            Vérifier une autre commande
          </button>
        </div>
      </div>
    </div>
  </section>
</main>
