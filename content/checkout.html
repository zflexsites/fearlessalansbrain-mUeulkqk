  <section

    style="background-color: var(--bg-color, #fff)"
  >
    <div class="container mx-auto px-6">
      <div class="text-center">
        <h1
          id="checkout-title"
          class="text-4xl md:text-5xl font-bold transition-all duration-300"
          style="color: var(--text-color)"
        >
          Étape 1: Livraison
        </h1>
        <!-- BARRE DE PROGRESSION AMÉLIORÉE -->
        <div class="max-w-2xl mx-auto mt-6">
          <div
            class="w-full bg-gray-200 rounded-full h-3 relative overflow-hidden"
          >
            <div
              id="progress-bar"
              class="bg-gradient-to-r from-primary to-primary/70 h-3 rounded-full absolute left-0 top-0"
              style="
                width: 25%;
                transition: width 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
              "
            ></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="py-8" style="background-color: var(--card-bg-color, #f9fafb)">

        <div
          id="order-summary"
          class="lg:col-span-2 p-6 rounded-lg"
          style="
            background-color: var(--card-bg-color, #fff);

          "
        >
          <h2 class="text-xl font-semibold mb-4">Résumé de votre commande</h2>
          <div
            id="summary-items-list"

            style="border-color: var(--card-border-color)"

              style="color: var(--text-muted-color)"

              Chargement du résumé...

          </div>
          <div class="space-y-2">
            <div class="flex justify-between">
              <span style="color: var(--text-muted-color)">Sous-total</span>

            <div class="flex justify-between">

              <span style="color: var(--text-color)">Gratuite</span>

          </div>
          <div
            class="flex justify-between font-bold text-lg border-t pt-4 mt-4"
            style="border-color: var(--card-border-color)"
          >
            <span>Total</span>
            <span id="summary-total">...</span>
          </div>
        </div>

        <!-- === Colonne 2 (Formulaire multi-étapes) - À DROITE sur desktop === -->
        <div class="lg:col-span-3">
          <form id="checkout-form">
            <!-- === ÉTAPE 1: ADRESSE (Visible par défaut) === -->
            <div id="step-address" class="space-y-4">
              <h2 class="text-xl font-semibold">
                Vos informations de livraison
              </h2>
              <div>
                <label for="name" class="block text-sm font-medium"
                  >Nom complet</label
                >
                <input
                  type="text"
                  id="name"
                  name="name"
                  required
                  autocomplete="name"
                  class="w-full p-3 rounded-lg border focus:ring-2 focus:ring-primary outline-none"
                  style="
                    background: var(--input-bg-color);
                    border-color: var(--card-border-color);
                    color: var(--text-color);
                  "
                />
              </div>
              <div>
                <label for="email" class="block text-sm font-medium"
                  >Adresse e-mail (pour le reçu)</label
                >
                <input
                  type="email"
                  id="email"
                  name="email"
                  required
                  autocomplete="email"
                  class="w-full p-3 rounded-lg border focus:ring-2 focus:ring-primary outline-none"
                  style="
                    background: var(--input-bg-color);
                    border-color: var(--card-border-color);
                    color: var(--text-color);
                  "
                />
              </div>
              <div>
                <label for="phone" class="block text-sm font-medium"
                  >Numéro de téléphone</label
                >
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  required
                  autocomplete="tel"
                  class="w-full p-3 rounded-lg border focus:ring-2 focus:ring-primary outline-none"
                  style="
                    background: var(--input-bg-color);
                    border-color: var(--card-border-color);
                    color: var(--text-color);
                  "
                />
              </div>
              <div>
                <label for="address" class="block text-sm font-medium"
                  >Adresse de livraison</label
                >
                <!-- NOUVELLE STRUCTURE POUR L'ICÔNE GÉOLOC -->
                <div class="relative">
                  <textarea
                    id="address"
                    name="address"
                    rows="3"
                    required
                    autocomplete="street-address"
                    class="w-full p-3 pr-10 rounded-lg border focus:ring-2 focus:ring-primary outline-none"
                    style="
                      background: var(--input-bg-color);
                      border-color: var(--card-border-color);
                      color: var(--text-color);
                    "
                  ></textarea>
                  <button
                    type="button"
                    id="use-geolocation-btn"
                    title="Utiliser ma position actuelle"
                    class="absolute top-3 right-3 text-gray-400 hover:text-primary transition-colors"
                  >
                    <svg
                      class="w-5 h-5"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"
                      ></path>
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"
                      ></path>
                    </svg>
                  </button>
                </div>
              </div>
              <div>
                <label for="notes" class="block text-sm font-medium"
                  >Notes (optionnel)</label
                >
                <textarea
                  id="notes"
                  name="notes"
                  rows="2"
                  class="w-full p-3 rounded-lg border focus:ring-2 focus:ring-primary outline-none"
                  style="
                    background: var(--input-bg-color);
                    border-color: var(--card-border-color);
                    color: var(--text-color);
                  "
                ></textarea>
              </div>
              <button
                type="button"
                id="continue-to-payment-btn"
                class="w-full bg-primary text-white text-lg font-semibold py-3 rounded-lg hover:opacity-90 transition-opacity disabled:opacity-50 disabled:cursor-not-allowed btn-primary"
              >
                Continuer vers le paiement
              </button>
            </div>

            <!-- === ÉTAPE 2: PAIEMENT (Cachée par défaut) === -->
            <div id="step-payment" class="hidden space-y-4">
              <h2 class="text-xl font-semibold">Informations de paiement</h2>

              <div>
                <label for="payment-phone" class="block text-sm font-medium"
                  >Votre numéro de téléphone Mobile Money</label
                >
                <div class="relative mt-1">
                  <div
                    class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3"
                  >
                    <span class="text-gray-500 sm:text-sm">+243</span>
                  </div>
                  <input
                    type="tel"
                    id="payment-phone"
                    name="payment_phone"
                    required
                    class="w-full p-3 pl-12 rounded-lg border focus:ring-2 focus:ring-primary outline-none"
                    style="
                      background: var(--input-bg-color);
                      border-color: var(--card-border-color);
                      color: var(--text-color);
                    "
                    placeholder="812345678"
                  />
                  <!-- Le logo de l'opérateur s'affichera ici -->
                  <div
                    id="operator-logo-container"
                    class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3"
                  >
                    <!-- Exemple: <img src="/assets/mpesa.png" class="h-6"> -->
                  </div>
                </div>
                <input
                  type="hidden"
                  id="selected-payment-method"
                  name="payment_method"
                />
              </div>

              <div
                id="payment-instructions"
                class="text-sm p-3 rounded-lg min-h-[60px]"
                style="
                  background-color: var(--input-bg-color);
                  color: var(--text-muted-color);
                "
              >
                <p>Veuillez entrer votre numéro pour détecter l'opérateur.</p>
              </div>

              <button
                type="submit"
                id="submit-order-btn"
                class="w-full bg-primary text-white text-lg font-semibold py-3 rounded-lg hover:opacity-90 transition-opacity disabled:opacity-50 disabled:cursor-not-allowed btn-primary"
              >
                <span class="btn-text">Confirmer et Payer</span>
                <span
                  class="btn-spinner hidden ml-2 inline-block"
                  aria-hidden="true"
                >
                  <svg
                    class="w-5 h-5 animate-spin"
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <circle
                      cx="12"
                      cy="12"
                      r="10"
                      stroke="currentColor"
                      stroke-opacity="0.2"
                      stroke-width="4"
                    ></circle>
                    <path
                      d="M22 12a10 10 0 00-10-10"
                      stroke="currentColor"
                      stroke-width="4"
                      stroke-linecap="round"
                    ></path>
                  </svg>
                </span>
              </button>
            </div>
            <div
              id="checkout-error"
              class="text-red-500 text-sm mt-2 hidden"
            ></div>
          </form>
        </div>
      </div>
    </div>
  </section>
</main>
